name: Draft and Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Create Release & Package Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Verify Environment
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify C Firmware Compilation
        run: |
          gcc -O3 -shared -fPIC -o firmware/foc_firmware.so firmware/foc_firmware.c -lm
          ls -la firmware/foc_firmware.so

      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} — 1.0 MW Inverted BLDC Motor Architecture
          draft: false
          prerelease: false
          files: |
            firmware/foc_firmware.c
            simulations/poc_coreless_vs_iron.py
            simulations/aerospace_1mw_flight.py
            simulations/regen_thermo_suite.py
            docs/*.pdf
          body_path: RELEASE_NOTES_v1.0.0.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

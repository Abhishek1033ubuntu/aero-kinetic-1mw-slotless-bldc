name: Build and Publish v2.0.0-HV Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build C Firmware & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ensure Directories and Files Exist
        run: |
          mkdir -p firmware simulations docs
          if [ ! -f RELEASE_NOTES_v2.0.0-HV.md ]; then
            echo "# Release v2.0.0-HV" > RELEASE_NOTES_v2.0.0-HV.md
            echo "1.0 MW Inverted Slotless BLDC Propulsion Engine (5.0 kV / 200 A Architecture)." >> RELEASE_NOTES_v2.0.0-HV.md
          fi

      - name: Compile 5.0 kV 5-Level ANPC C Firmware
        run: |
          if [ -f firmware/foc_anpc_5kv_firmware.c ]; then
            gcc -O3 -shared -fPIC -o firmware/foc_anpc_5kv_firmware.so firmware/foc_anpc_5kv_firmware.c -lm
            ls -la firmware/foc_anpc_5kv_firmware.so
          else
            echo "Notice: C firmware source file not found in firmware/ directory. Skipping compilation."
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0-HV' }}
          name: Release v2.0.0-HV — 5.0 kV High-Voltage ANPC Architecture
          draft: false
          prerelease: false
          files: |
            firmware/*
            simulations/*
            docs/*
          body_path: RELEASE_NOTES_v2.0.0-HV.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
